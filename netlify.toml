# Netlify settings — used when the site is deployed from a Git repository.
# (For drag-and-drop deploys this file is ignored and the folder is published as-is.)
[build]
  # Runs the build script; if it fails for any reason, the site is published as-is instead.
  command = "node scripts/build.mjs || (echo 'Build script failed - publishing files as-is' && rm -rf dist && mkdir -p dist && cp -r index.html sw.js manifest.json manifest.js app.webmanifest icons images sounds dist/)"
  publish = "dist"

# Always check for a fresh copy of the app, its manifest and the offline worker
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.*"
  [headers.values]
    Cache-Control = "no-cache"

# Images and sounds rarely change — let browsers keep them for a week
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
